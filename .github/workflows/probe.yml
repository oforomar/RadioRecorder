name: Probe stream
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Follow redirects, show headers
        run: |
          curl -sS -m 20 -D - -o /tmp/a.bin -L --max-filesize 100000 -r 0-60000 "https://stream.radiojar.com/8s5u5tpdtwzuv" -w '\nFINAL %{url_effective} code=%{http_code} type=%{content_type} bytes=%{size_download}\n' || true
          head -c 64 /tmp/a.bin | xxd | head -4 || true
      - name: Redirect chain without following
        run: curl -sS -m 15 -o /dev/null -D - "https://stream.radiojar.com/8s5u5tpdtwzuv" || true
      - name: Radio-browser candidates
        run: |
          for q in "%D8%A7%D9%84%D9%82%D8%B1%D8%A2%D9%86" "quran" "Holy%20Quran"; do
            curl -sS -m 20 "https://de1.api.radio-browser.info/json/stations/search?countrycode=EG&name=$q&limit=40&hidebroken=true" \
             | jq -r '.[] | [.name, .url_resolved, .codec, (.bitrate|tostring), .lastcheckok|tostring] | @tsv' || true
          done | sort -u
