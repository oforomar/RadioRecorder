name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "RadioRecorder-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RadioRecorder-${{ github.run_number }}
          path: RadioRecorder-*.apk

      # A release per build, so the newest APK is always at /releases/latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: RadioRecorder-*.apk
          make_latest: true
